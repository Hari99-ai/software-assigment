services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.0.3
    restart: unless-stopped
    ports: ["127.0.0.1:5678:5678"]
    environment:
      GENERIC_TIMEZONE: Asia/Kolkata
      TZ: Asia/Kolkata
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set a random encryption key}
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes: ["n8n_data:/home/node/.n8n"]
    depends_on: [publisher]
  publisher:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google.json
      JOURNAL_PATH: /data/publications.sqlite
      TZ: Asia/Kolkata
    volumes:
      - publisher_data:/data
      - ./secrets/google.json:/run/secrets/google.json:ro
    extra_hosts: ["host.docker.internal:host-gateway"]
volumes:
  n8n_data:
  publisher_data:
